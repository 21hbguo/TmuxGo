name: Validate cell protocol v2

on:
  push:
    branches:
      - perf/cell-protocol-v2-graphemes

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cell-protocol-v2-graphemes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run gateway terminal tests
        run: pnpm --filter gateway exec tsx --test ../../tests/terminal-grid.test.ts ../../tests/stream-binary.test.ts
      - name: Run frontend cell tests
        run: pnpm --filter frontend exec vitest run src/lib/terminal-grid/decode-cell.test.ts src/lib/stream-binary.test.ts
      - name: Build gateway
        run: pnpm --filter gateway build
      - name: Build frontend
        run: pnpm --filter frontend build
