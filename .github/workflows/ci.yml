name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint . --quiet
      # 输出 warning 统计并对照基线：只允许下降，不引入 --max-warnings 0 硬门槛
      - run: pnpm run check:eslint-warnings
      - run: pnpm run typecheck
      # 只校验本 PR/push 变更文件的格式，不做全仓格式化；与本地 lint-staged 互补
      # 基准由 scripts/ci-changed-range.ts 按来源解析（PR 三点 / push before /
      # 手动触发 / 无有效父基准），空集合时显式 echo，不做静默零文件通过
      - name: Check formatting of changed files
        run: |
          range=$(pnpm exec tsx scripts/ci-changed-range.ts \
            --event "${{ github.event_name }}" \
            --base-ref "${{ github.base_ref }}" \
            --before "${{ github.event.before }}")
          echo "Changed-files range: $range"
          changed=$(mktemp)
          trap 'rm -f "$changed"' EXIT
          git diff --name-only -z --diff-filter=ACMR "$range" > "$changed"
          if [ -s "$changed" ]; then
            tr '\0' '\n' < "$changed"
            xargs -0 pnpm exec prettier --check --ignore-unknown < "$changed"
          else
            echo "No changed files to check (range: $range)"
          fi
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            pnpm: 10
          - node: 22
            pnpm: 11.7.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y tmux ripgrep
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm test 收集 tests/ 与 apps/gateway/src 全部用例（含鉴权/分享/终端流），失败即阻断
      - run: pnpm test
      - run: pnpm run test:frontend
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y tmux ripgrep
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 轻量冒烟：登录 + 终端附着 + 基本输入；完整套件由下方 e2e job 承担
      - run: pnpm run test:smoke
        env:
          CI: '1'
  # 完整 e2e 自动跑但不作合并门禁：PR/push 产出回归信号，暂不列 required check
  # （单人仓库先测时长与 flake 率；升级为门禁需另配分支保护）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y tmux ripgrep
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
        env:
          CI: '1'
      # 失败时保留 trace/截图便于定位；产物仅含隔离环境的测试凭据与测试终端输出
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
