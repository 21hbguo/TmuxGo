name: Validate headless cell parser

on:
  push:
    branches:
      - perf/headless-cell-parser
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/headless-cell-parser
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run terminal transport tests
        run: pnpm --filter gateway exec tsx --test ../../tests/terminal-grid.test.ts ../../tests/stream-binary.test.ts
      - name: Build gateway
        run: pnpm --filter gateway build
