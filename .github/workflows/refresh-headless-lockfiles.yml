name: Refresh headless lockfiles

on:
  push:
    branches:
      - perf/headless-cell-parser
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/headless-cell-parser
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfiles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh lockfiles for xterm headless"
          git push
