<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilePanel - 轻透型玻璃 UI</title>
  <style>
    :root {
      --accent: 10 132 255;
      --bg-0: 12 13 15;
      --bg-1: 24 25 28;
      --bg-2: 42 43 48;
      --text-1: 245 245 247;
      --text-2: 174 174 178;
      --text-3: 116 116 122;
      --glass-blur: 11px;
      --glass-saturate: 180%;
      --glass-fill: rgb(255 255 255 / 5%);
      --glass-rim: rgb(255 255 255 / 16%);
      --glass-highlight: rgb(255 255 255 / 30%);
      --glass-shadow: 0 4px 16px rgb(0 0 0 / 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgb(var(--accent) / 0.12) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 70%, rgb(48 209 88 / 0.06) 0%, transparent 45%),
        rgb(var(--bg-0));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    .demo-container { padding: 32px; }

    .glass-panel {
      width: 340px;
      border-radius: 16px;
      border: 1px solid var(--glass-rim);
      background: var(--glass-fill);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      position: relative;
    }

    .toolbar {
      padding: 10px 12px;
      border-bottom: 1px solid rgb(255 255 255 / 8%);
    }
    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .glass-select {
      flex: 1;
      min-width: 0;
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid var(--glass-rim);
      background: rgb(255 255 255 / 4%);
      color: rgb(var(--text-1));
      font-size: 11px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .glass-chip {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--glass-rim);
      background: rgb(255 255 255 / 4%);
      color: rgb(var(--text-3));
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .glass-chip:hover {
      background: rgb(255 255 255 / 8%);
      color: rgb(var(--text-1));
      border-color: rgb(255 255 255 / 24%);
    }
    .glass-chip.active {
      background: rgb(var(--accent) / 20%);
      color: rgb(var(--accent));
      border-color: rgb(var(--accent) / 30%);
    }

    .search-bar {
      padding: 8px 12px;
      border-bottom: 1px solid rgb(255 255 255 / 8%);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .search-toggle {
      display: flex;
      border-radius: 8px;
      border: 1px solid var(--glass-rim);
      background: rgb(255 255 255 / 3%);
      padding: 2px;
      gap: 2px;
    }
    .toggle-btn {
      flex: 1;
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: rgb(var(--text-3));
      font-size: 10px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      text-transform: capitalize;
    }
    .toggle-btn.active {
      background: rgb(var(--accent) / 20%);
      color: rgb(var(--accent));
      border: 1px solid rgb(var(--accent) / 30%);
    }
    .toggle-btn:hover:not(.active) {
      background: rgb(255 255 255 / 5%);
      color: rgb(var(--text-2));
    }
    .search-input-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .glass-input {
      flex: 1;
      min-width: 0;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--glass-rim);
      background: rgb(255 255 255 / 4%);
      color: rgb(var(--text-1));
      font-size: 11px;
      font-family: monospace;
      outline: none;
    }
    .glass-input::placeholder { color: rgb(var(--text-3) / 0.6); }
    .glass-input:focus {
      border-color: rgb(var(--accent) / 40%);
      background: rgb(255 255 255 / 6%);
    }
    .glass-select-sm {
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--glass-rim);
      background: rgb(255 255 255 / 4%);
      color: rgb(var(--text-2));
      font-size: 10px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .toolbar-icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: rgb(var(--text-3));
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toolbar-icon:hover {
      background: rgb(255 255 255 / 8%);
      color: rgb(var(--text-1));
      border-color: var(--glass-rim);
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .file-list {
      max-height: 420px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .file-list::-webkit-scrollbar { width: 8px; }
    .file-list::-webkit-scrollbar-track {
      background: rgb(255 255 255 / 2%);
      border-radius: 4px;
    }
    .file-list::-webkit-scrollbar-thumb {
      background: rgb(255 255 255 / 15%);
      border-radius: 4px;
    }
    .file-list::-webkit-scrollbar-thumb:hover {
      background: rgb(255 255 255 / 25%);
    }

    .tree-node {
      display: flex;
      align-items: center;
      min-height: 26px;
      padding-right: 8px;
    }
    .expand-btn {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: rgb(var(--text-3));
      font-size: 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.1s ease;
    }
    .expand-btn:hover { color: rgb(var(--accent)); }
    .expand-placeholder { width: 16px; flex-shrink: 0; }
    .file-item {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }
    .file-item:hover { background: rgb(255 255 255 / 6%); }
    .file-item.selected {
      background: rgb(var(--accent) / 15%);
    }
    .file-item.selected .file-name { color: rgb(var(--accent)); }
    .file-icon {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-family: monospace;
      flex-shrink: 0;
      color: rgb(var(--text-3));
    }
    .file-icon.directory { color: #dcb67a; }
    .file-icon.file-md { color: #79d2a6; }
    .file-icon.file-img { color: #61c7ff; }
    .file-icon.file-code { color: #c2d1ff; }
    .file-name {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      font-family: monospace;
      color: rgb(var(--text-2));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-size: 9px;
      color: rgb(var(--text-3));
      font-family: monospace;
      flex-shrink: 0;
    }
    .empty-dir {
      font-size: 9px;
      color: rgb(var(--text-3) / 0.6);
      font-family: monospace;
      flex-shrink: 0;
    }

    .context-menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 99;
    }
    .context-menu {
      position: fixed;
      z-index: 100;
      min-width: 160px;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--glass-rim);
      background: rgb(24 25 28 / 0.92);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow: 0 8px 32px rgb(0 0 0 / 0.28);
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: rgb(var(--text-2));
      font-size: 11px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .menu-item:hover {
      background: rgb(255 255 255 / 10%);
      color: rgb(var(--text-1));
    }
    .menu-item.danger { color: rgb(255 69 58); }
    .menu-item.danger:hover { background: rgb(255 69 58 / 12%); }
    .menu-icon { width: 14px; font-size: 11px; text-align: center; }
    .menu-divider {
      height: 1px;
      margin: 4px 8px;
      background: rgb(255 255 255 / 8%);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="glass-panel">
      <div class="toolbar">
        <div class="toolbar-row">
          <select class="glass-select" id="rootSelect">
            <option>Workspace</option>
            <option>Home</option>
          </select>
          <button class="glass-chip" id="uploadBtn">↑ 上传</button>
          <button class="glass-chip" id="trashBtn">♲ 回收站</button>
        </div>
      </div>
      <div class="search-bar">
        <div class="search-toggle">
          <button class="toggle-btn active" id="nameMode">name</button>
          <button class="toggle-btn" id="contentMode">content</button>
        </div>
        <div class="search-input-row">
          <input type="text" class="glass-input" placeholder="Search files..." id="searchInput" />
          <button class="toolbar-icon" id="clearExpandBtn" title="清除展开">⌂</button>
          <button class="toolbar-icon" id="clearSearchBtn">×</button>
          <select class="glass-select-sm" id="sortSelect">
            <option>name</option>
            <option>size</option>
            <option>modified</option>
          </select>
          <button class="toolbar-icon" id="sortDirBtn">↑</button>
        </div>
        <div class="filter-row">
          <div class="search-toggle">
            <button class="toggle-btn active" id="filterAll">all</button>
            <button class="toggle-btn" id="filterFile">file</button>
            <button class="toggle-btn" id="filterDir">directory</button>
          </div>
          <button class="toggle-btn" id="dotToggle">.dot</button>
        </div>
      </div>
      <div class="file-list" id="fileList"></div>
      <div id="contextMenu" class="context-menu" style="display:none;"></div>
      <div id="contextOverlay" class="context-menu-overlay" style="display:none;"></div>
    </div>
  </div>

  <script>
    const fileTree = [
      { name: 'src', path: 'src', type: 'directory', icon: '▣', depth: 0, expanded: false, children: [
        { name: 'components', path: 'src/components', type: 'directory', icon: '▣', depth: 1, expanded: false, children: [
          { name: 'Button.tsx', path: 'src/components/Button.tsx', type: 'file', icon: 'M', size: '4.2KB', depth: 2 },
          { name: 'Chip.tsx', path: 'src/components/Chip.tsx', type: 'file', icon: 'M', size: '2.1KB', depth: 2 },
        ]},
        { name: 'hooks', path: 'src/hooks', type: 'directory', icon: '▣', depth: 1, expanded: false, children: [
          { name: 'useApi.ts', path: 'src/hooks/useApi.ts', type: 'file', icon: '<>', size: '3.8KB', depth: 2 },
        ]},
        { name: 'lib', path: 'src/lib', type: 'directory', icon: '▣', depth: 1, expanded: false, children: [] },
        { name: 'App.tsx', path: 'src/App.tsx', type: 'file', icon: 'M', size: '4.2KB', depth: 1 },
        { name: 'index.tsx', path: 'src/index.tsx', type: 'file', icon: 'M', size: '1.8KB', depth: 1 },
      ]},
      { name: 'package.json', path: 'package.json', type: 'file', icon: '{ }', size: '2.1KB', depth: 0 },
      { name: 'README.md', path: 'README.md', type: 'file', icon: 'M', size: '8.5KB', depth: 0 },
      { name: '.gitignore', path: '.gitignore', type: 'file', icon: '□', size: '0.3KB', depth: 0 },
      { name: 'images', path: 'images', type: 'directory', icon: '▣', depth: 0, expanded: false, children: [
        { name: 'logo.png', path: 'images/logo.png', type: 'file', icon: '▧', size: '128KB', depth: 1 },
        { name: 'banner.webp', path: 'images/banner.webp', type: 'file', icon: '▧', size: '256KB', depth: 1 },
      ]},
      { name: 'utils.ts', path: 'utils.ts', type: 'file', icon: '<>', size: '3.4KB', depth: 0 },
      { name: 'config.yaml', path: 'config.yaml', type: 'file', icon: '□', size: '1.1KB', depth: 0 },
    ];

    let selectedPath = 'src/components/Button.tsx';
    let searchMode = 'name';
    let typeFilter = 'all';
    let hideDotFiles = true;
    let contextMenuItem = null;

    function flattenTree(nodes) {
      const result = [];
      for (const node of nodes) {
        const row = { ...node };
        if (row.type === 'directory' && row.expanded && node.children) {
          row.showExpand = true;
        }
        result.push(row);
        if (node.type === 'directory' && node.expanded && node.children) {
          result.push(...flattenTree(node.children));
        }
      }
      return result;
    }

    function getIconClass(node) {
      if (node.type === 'directory') return 'directory';
      if (node.name.endsWith('.md')) return 'file-md';
      if (['.png', '.jpg', '.webp', '.gif'].some(e => node.name.endsWith(e))) return 'file-img';
      return 'file-code';
    }

    function renderFileList() {
      const list = document.getElementById('fileList');
      let files = flattenTree(fileTree);
      if (hideDotFiles) files = files.filter(f => !f.name.startsWith('.'));
      if (typeFilter !== 'all') files = files.filter(f => f.type === typeFilter);
      
      list.innerHTML = files.map(item => `
        <div class="tree-node" style="padding-left: ${item.depth * 14 + 8}px">
          ${item.type === 'directory' 
            ? `<button class="expand-btn" onclick="toggleExpand('${item.path}')">${item.expanded ? '▾' : '▸'}</button>`
            : '<span class="expand-placeholder"></span>'
          }
          <div class="file-item ${selectedPath === item.path ? 'selected' : ''}" 
               onclick="selectItem('${item.path}')"
               ondblclick="handleDoubleClick('${item.path}')"
               oncontextmenu="showContextMenu(event, '${item.path}')">
            <span class="file-icon ${getIconClass(item)}">${item.icon}</span>
            <span class="file-name">${item.name}</span>
            ${item.type === 'file' ? `<span class="file-size">${item.size}</span>` : ''}
            ${item.type === 'directory' && item.children && item.children.length === 0 ? '<span class="empty-dir">empty</span>' : ''}
          </div>
        </div>
      `).join('');
    }

    function findNode(path, nodes = fileTree) {
      for (const node of nodes) {
        if (node.path === path) return node;
        if (node.children) {
          const found = findNode(path, node.children);
          if (found) return found;
        }
      }
      return null;
    }

    function toggleExpand(path) {
      const node = findNode(path);
      if (node) {
        node.expanded = !node.expanded;
        renderFileList();
      }
    }

    function selectItem(path) {
      selectedPath = path;
      renderFileList();
    }

    function handleDoubleClick(path) {
      const node = findNode(path);
      if (node) {
        if (node.type === 'directory') toggleExpand(path);
        else console.log('Insert path:', path);
      }
    }

    function showContextMenu(e, path) {
      e.preventDefault();
      contextMenuItem = findNode(path);
      const menu = document.getElementById('contextMenu');
      menu.innerHTML = `
        ${contextMenuItem?.type === 'directory' ? '<button class="menu-item" onclick="handleAction(\'favorite\')"><span class="menu-icon">★</span> 收藏</button>' : ''}
        ${contextMenuItem?.type === 'file' ? '<button class="menu-item" onclick="handleAction(\'open\')"><span class="menu-icon">⟐</span> 在编辑器打开</button>' : ''}
        <button class="menu-item" onclick="handleAction('insert')"><span class="menu-icon">→</span> 插入路径</button>
        <button class="menu-item" onclick="handleAction('copyName')"><span class="menu-icon">◎</span> 复制名称</button>
        <button class="menu-item" onclick="handleAction('copyPath')"><span class="menu-icon">⊞</span> 复制路径</button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="handleAction('copy')"><span class="menu-icon">⎘</span> 复制到...</button>
        <button class="menu-item" onclick="handleAction('move')"><span class="menu-icon">→</span> 移动到...</button>
        <button class="menu-item" onclick="handleAction('rename')"><span class="menu-icon">✎</span> 重命名</button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="handleAction('newFile')"><span class="menu-icon">+</span> 新建文件</button>
        <button class="menu-item" onclick="handleAction('newFolder')"><span class="menu-icon">+</span> 新建文件夹</button>
        <div class="menu-divider"></div>
        <button class="menu-item danger" onclick="handleAction('delete')"><span class="menu-icon">🗑</span> 移至回收站</button>
      `;
      
      let x = e.clientX;
      let y = e.clientY;
      menu.style.display = 'block';
      document.getElementById('contextOverlay').style.display = 'block';
      
      setTimeout(() => {
        const rect = menu.getBoundingClientRect();
        if (x + rect.width > window.innerWidth) x = window.innerWidth - rect.width - 10;
        if (y + rect.height > window.innerHeight) y = window.innerHeight - rect.height - 10;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
      }, 0);
    }

    function closeContextMenu() {
      document.getElementById('contextMenu').style.display = 'none';
      document.getElementById('contextOverlay').style.display = 'none';
      contextMenuItem = null;
    }

    function handleAction(action) {
      console.log('Action:', action, contextMenuItem?.name);
      closeContextMenu();
    }

    document.getElementById('contextOverlay').addEventListener('click', closeContextMenu);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeContextMenu(); });

    document.getElementById('nameMode').addEventListener('click', function() {
      document.getElementById('nameMode').classList.add('active');
      document.getElementById('contentMode').classList.remove('active');
      searchMode = 'name';
    });
    document.getElementById('contentMode').addEventListener('click', function() {
      document.getElementById('contentMode').classList.add('active');
      document.getElementById('nameMode').classList.remove('active');
      searchMode = 'content';
    });
    document.getElementById('filterAll').addEventListener('click', function() {
      document.querySelectorAll('#filterAll,#filterFile,#filterDir').forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      typeFilter = 'all';
      renderFileList();
    });
    document.getElementById('filterFile').addEventListener('click', function() {
      document.querySelectorAll('#filterAll,#filterFile,#filterDir').forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      typeFilter = 'file';
      renderFileList();
    });
    document.getElementById('filterDir').addEventListener('click', function() {
      document.querySelectorAll('#filterAll,#filterFile,#filterDir').forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      typeFilter = 'directory';
      renderFileList();
    });
    document.getElementById('dotToggle').addEventListener('click', function() {
      this.classList.toggle('active');
      hideDotFiles = !this.classList.contains('active');
      renderFileList();
    });

    renderFileList();
  </script>
</body>
</html>
