<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilePanel 液态玻璃风格对比</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0c0d0f 0%, #18191c 100%);
      min-height: 100vh;
      color: #f5f5f7;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
    h1 { 
      text-align: center; 
      font-size: 28px; 
      font-weight: 600; 
      margin-bottom: 12px;
      background: linear-gradient(90deg, #0a84ff, #5e5ce6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { text-align: center; color: #8e8e93; margin-bottom: 40px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 32px; }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .card img { width: 100%; display: block; }
    .card-info { padding: 20px; }
    .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #8e8e93; line-height: 1.5; }
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 12px;
    }
    .tag-a { background: rgba(10,132,255,0.2); color: #0a84ff; }
    .tag-b { background: rgba(94,92,230,0.2); color: #5e5ce6; }
    .tag-c { background: rgba(48,209,88,0.2); color: #30d158; }
    .open-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #f5f5f7;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .open-btn:hover { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="container">
    <h1>FilePanel iOS 27 液态玻璃风格</h1>
    <p class="subtitle">三种差异化设计方案，点击卡片可查看完整交互原型</p>
    <div class="grid">
      <div class="card">
        <img src="A-light.png" alt="轻透型">
        <div class="card-info">
          <h2>A · 轻透型</h2>
          <p>极低透明度填充 + 细微毛玻璃，适合深色背景的通透感。边框极细，投影柔和低调。</p>
          <span class="tag tag-a">Blur 11px · Fill 5%</span>
          <br>
          <a href="A-light.html" class="open-btn" target="_blank">打开交互原型 →</a>
        </div>
      </div>
      <div class="card">
        <img src="B-layered.png" alt="层次型">
        <div class="card-info">
          <h2>B · 层次型</h2>
          <p>多层玻璃叠加 + 边框光晕，增强卡片感。投影层次分明，视觉焦点突出。</p>
          <span class="tag tag-b">Blur 18px · Fill 12%</span>
          <br>
          <a href="B-layered.html" class="open-btn" target="_blank">打开交互原型 →</a>
        </div>
      </div>
      <div class="card">
        <img src="C-immersive.png" alt="沉浸型">
        <div class="card-info">
          <h2>C · 沉浸型</h2>
          <p>高饱和渐变背景 + 强烈毛玻璃，参考 visionOS 风格。沉浸感强，适合展示场景。</p>
          <span class="tag tag-c">Blur 28px · Fill 18%</span>
          <br>
          <a href="C-immersive.html" class="open-btn" target="_blank">打开交互原型 →</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
